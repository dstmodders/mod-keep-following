name: CI

on:
  push:
    branches:
      - v0.21
  pull_request:
    branches:
      - v0.21

env:
  SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
  SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
  SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Lint
        uses: dstmodders/action@2c75c4d232f86d778729d3066d1db82b76ab1df3 # main
        with:
          ignore-set-output: true
          luacheck: true
          prettier: true
          slack: true
          stylua: true

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Test
        uses: dstmodders/action@2c75c4d232f86d778729d3066d1db82b76ab1df3 # main
        with:
          busted: true
          ignore-set-output: true
          slack: true
      - name: Test with coverage
        run: |
          docker run --rm -t \
            -v "$(pwd):/opt/mod-keep-following/" \
            -w /opt/mod-keep-following/ \
            -u "$(id -u):$(id -g)" \
            dstmodders/dst-mod:latest \
            /bin/bash -c 'busted . && luacov -r lcov && cp luacov.report.out lcov.info'
      - name: Upload coverage to Codecov
        if: ${{ !env.ACT && success() }}
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
